<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Practice</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<!-- Content will go here -->
 <h1 class="text-center" style="padding: 20px;">User Signup</h1>
 <p class="text-center">Create and account to get started.</p>

 <div class="container">
 </div>
 <form class="m-3" onsubmit="submitForm(event)">
    <div style="width: 500px;height: 300px;margin: 0 auto;">
     <div class="mb-3">
        <label for="exampleInputUsername" class="form-label">Username:</label>
        <input type="text" class="form-control" id="username" 
       placeholder="Enter username" onfocusout="validate(this)">
    </div>
    <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Email address:</label>
        <input type="email" class="form-control" id="email" 
       onfocusout="validate(this)">    </div>
    <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Password:</label>
        <input type="password" class="form-control" id="password" 
       onfocusout="validate(this)">
    </div>
     <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Confirm Password:</label>
        <input type="password" class="form-control" id="confirmPassword" 
       onfocusout="validate(this)">
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
    <button class="btn btn-secondary" onclick="window.open('https\://mmt6227.github.io/ist256-l2')">Back to storefront</button>
</div>
</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

<script>
function validate(obj) {
  if (obj.value.trim() === "") {
    obj.style.color = "#FF0000";
    return false;
  }

  if (obj.id === "email") {
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(obj.value)) {
      obj.style.color = "#FF0000";
      return false;
    }
  }

  if (obj.id === "password" || obj.id === "confirmPassword") {
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    
    if (password && confirmPassword && password !== confirmPassword) {
      document.getElementById("confirmPassword").style.color = "#FF0000";
      document.getElementById("password").style.color = "#FF0000";
      return false;
    } else if (password && confirmPassword && password === confirmPassword) {
      document.getElementById("password").style.color = "#000000";
      document.getElementById("confirmPassword").style.color = "#000000";
    }
  }

  obj.style.color = "#000000";
  return true;
}

function submitForm(event) {
  event.preventDefault();
  
  const username = document.getElementById("username");
  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const confirmPassword = document.getElementById("confirmPassword");
  
  let isValid = true;
  [username, email, password, confirmPassword].forEach(field => {
    if (!validate(field)) {
      isValid = false;
    }
  });
  
  if (isValid) {
    alert("Form submitted successfully!");
    document.querySelector("form").reset();
    [username, email, password, confirmPassword].forEach(field => {
      field.style.color = "#000000";
    });
  } else {
    alert("Please fix all errors before submitting.");
  }
}
</script>
    
</body>
</html>
